<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Abside Marketplace</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="navbar">
        <div class="logo">Abside<span>Market</span></div>
        <div>🛒</div>
    </div>

    <input type="text" id="searchInput" class="search-box" placeholder="ابحث عن منتج..." style="width:100%; border:none;">

    <div class="products" id="productsContainer">
        {% for product in products %}
        <div class="product-card">
            <h3>{{ product.name }}</h3>
            <p>${{ "{:,.0f}".format(product.price) }}</p>
        </div>
        {% endfor %}
    </div>

    <script>
    const input = document.getElementById('searchInput');
    const container = document.getElementById('productsContainer');

    input.addEventListener('input', function() {
        const query = input.value;
        fetch('/api/search?q=' + encodeURIComponent(query))
            .then(res => res.json())
            .then(data => {
                container.innerHTML = '';
                data.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = '<h3>' + p.name + '</h3><p>$' + p.price.toLocaleString() + '</p>';
                    container.appendChild(card);
                });
            });
    });
    </script>

</body>
</html>
